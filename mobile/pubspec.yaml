name: rituva
description: "Rituva — seasonal, guideline-grounded menu planner (Flutter client for the Rituva API)."
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  path_provider: ^2.1.2      # where a downloaded full KB is stored for offline use
  flutter_native_splash: ^2.4.1   # runtime preserve()/remove() + splash generation
  pdf: ^3.11.1               # on-device PDF generation (weekly plan + grocery export)
  printing: ^5.13.2          # native share / print sheet for the generated PDF
  mobile_scanner: ^5.2.3     # camera barcode scanning → Open Food Facts lookup
  health: ^11.1.1            # Health Connect: steps/active energy → measured TDEE

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# Rituva "My Plate ring" launcher icon — generated via `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/rituva_icon.png"
  image_path_ios: "assets/icon/rituva_ios.png"   # opaque square (iOS forbids alpha)
  remove_alpha_ios: true
  adaptive_icon_background: "#0A1410"
  adaptive_icon_foreground: "assets/icon/rituva_fg.png"
  min_sdk_android: 21

# Rituva launch/splash screen — the "My Plate ring" on the brand-dark background, so the
# app opens on Rituva, never the default Flutter logo. Generated via
# `dart run flutter_native_splash:create` (run in CI too).
flutter_native_splash:
  color: "#0A1410"
  image: "assets/icon/rituva_fg.png"
  android_12:
    color: "#0A1410"
    image: "assets/icon/rituva_fg.png"
  color_dark: "#0A1410"
  image_dark: "assets/icon/rituva_fg.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/demo.json
    - assets/kb.json      # curated Knowledge DB — powers the offline engine
