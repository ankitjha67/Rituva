name: rituva
description: "Rituva — seasonal, guideline-grounded menu planner (Flutter client for the Rituva API)."
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

# Rituva "My Plate ring" launcher icon — generated in CI via `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/rituva_icon.png"
  image_path_ios: "assets/icon/rituva_ios.png"   # opaque square (iOS forbids alpha)
  remove_alpha_ios: true
  adaptive_icon_background: "#0A1410"
  adaptive_icon_foreground: "assets/icon/rituva_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/demo.json
